# Publishes TesserCADIna to GitHub Pages.
#
# There is no build step: the app is plain ES modules and the three.js runtime
# is vendored into vendor/. What is uploaded is dist-site/, assembled by
# tools/build-site.mjs: the files a browser loads and nothing beside them, so
# the test tooling, the desktop shell and the documents are not published as
# part of the site. Every other host serves the same directory.
name: Deploy TesserCADIna to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the geometry / CSG / DXF test suite
        run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must already be enabled on the repository (Settings -> Pages ->
      # Source: GitHub Actions). `enablement: true` cannot do it for you:
      # creating a Pages site needs repository-admin rights, which a workflow's
      # GITHUB_TOKEN never carries.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble the site
        run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v5
